name: Build FrameGen APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Install glslang-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile Vulkan Shaders (.comp -> .spv)
        run: |
          if [ -d "app/src/main/cpp/shaders" ]; then
            cd app/src/main/cpp/shaders
            for f in *.comp; do
              [ -e "$f" ] && glslangValidator -V "$f" -o "${f%.comp}.spv"
            done
            mkdir -p ../../assets/shaders
            cp *.spv ../../assets/shaders/ 2>/dev/null || true
          fi

      - name: Prepare Gradle Wrapper
        run: |
          [ -f "./gradlew" ] || gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameGen-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
